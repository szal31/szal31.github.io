<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fb923c"/><stop offset="1" stop-color="#7c2d12"/></linearGradient>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <circle cx="1350" cy="200" r="120" fill="#fde68a" opacity=".35"/>
  <rect x="160" y="200" width="1280" height="800" rx="32" fill="#fff"/>
  <text x="220" y="280" fill="#0f172a" font-size="32" font-weight="600">Air Pollution Index — Klang Valley</text>
  <text x="220" y="320" fill="#64748b" font-size="22">Actual readings vs 7-day forecast</text>
  <g font-size="20" fill="#475569">
    <rect x="1040" y="262" width="26" height="8" rx="4" fill="#c2410c"/><text x="1078" y="273">Actual</text>
    <rect x="1180" y="258" width="26" height="16" rx="4" fill="#fdba74"/><text x="1218" y="273">Forecast</text>
  </g>
  <g stroke="#f1f5f9" stroke-width="3">
    <line x1="220" y1="420" x2="1380" y2="420"/><line x1="220" y1="560" x2="1380" y2="560"/>
    <line x1="220" y1="700" x2="1380" y2="700"/><line x1="220" y1="840" x2="1380" y2="840"/>
  </g>
  <g fill="#94a3b8" font-size="18" text-anchor="end">
    <text x="205" y="426">150</text><text x="205" y="566">100</text><text x="205" y="706">50</text><text x="205" y="846">0</text>
  </g>
  <!-- unhealthy threshold -->
  <line x1="220" y1="560" x2="1380" y2="560" stroke="#ef4444" stroke-width="3" stroke-dasharray="10 10"/>
  <text x="1380" y="548" fill="#ef4444" font-size="18" text-anchor="end">Unhealthy</text>
  <!-- forecast band + line -->
  <path d="M1000 620 L1080 560 L1160 480 L1240 430 L1320 470 L1380 520 L1380 680 L1320 640 L1240 600 L1160 640 L1080 690 L1000 680 Z" fill="#fdba74" opacity=".55"/>
  <polyline points="1000,650 1080,625 1160,560 1240,515 1320,555 1380,600" fill="none" stroke="#ea580c" stroke-width="6" stroke-dasharray="14 10" stroke-linecap="round"/>
  <!-- actual -->
  <polyline points="220,760 300,740 380,770 460,720 540,735 620,690 700,710 780,680 860,700 940,670 1000,650" fill="none" stroke="#c2410c" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="1000" cy="650" r="12" fill="#c2410c" stroke="#fff" stroke-width="5"/>
  <line x1="1000" y1="380" x2="1000" y2="860" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1012" y="400" fill="#64748b" font-size="18">Today</text>
  <g fill="#94a3b8" font-size="18" text-anchor="middle">
    <text x="300" y="890">Aug</text><text x="540" y="890">Sep</text><text x="780" y="890">Oct</text><text x="1160" y="890">Next week</text>
  </g>
  <rect x="220" y="920" width="240" height="56" rx="28" fill="#ffedd5"/>
  <text x="340" y="956" fill="#c2410c" font-size="21" font-weight="600" text-anchor="middle">MAPE 12%</text>
</svg>
