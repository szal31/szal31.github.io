<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#0c4a6e"/></linearGradient>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <rect x="160" y="200" width="860" height="800" rx="32" fill="#fff"/>
  <text x="220" y="278" fill="#0f172a" font-size="30" font-weight="600">Customer segments (K-Means)</text>
  <text x="220" y="316" fill="#64748b" font-size="22">Recency vs monetary value</text>
  <g transform="translate(240 370)">
    <line x1="0" y1="540" x2="720" y2="540" stroke="#cbd5e1" stroke-width="3"/>
    <line x1="0" y1="0" x2="0" y2="540" stroke="#cbd5e1" stroke-width="3"/>
    <g fill="#0284c7" opacity=".8">
      <circle cx="120" cy="120" r="11"/><circle cx="150" cy="90" r="11"/><circle cx="90" cy="150" r="11"/><circle cx="170" cy="140" r="11"/><circle cx="130" cy="70" r="11"/><circle cx="200" cy="110" r="11"/>
    </g>
    <g fill="#f59e0b" opacity=".85">
      <circle cx="360" cy="270" r="11"/><circle cx="400" cy="240" r="11"/><circle cx="330" cy="310" r="11"/><circle cx="420" cy="300" r="11"/><circle cx="380" cy="330" r="11"/><circle cx="450" cy="260" r="11"/><circle cx="340" cy="230" r="11"/>
    </g>
    <g fill="#10b981" opacity=".85">
      <circle cx="580" cy="440" r="11"/><circle cx="620" cy="470" r="11"/><circle cx="550" cy="480" r="11"/><circle cx="650" cy="420" r="11"/><circle cx="600" cy="500" r="11"/><circle cx="530" cy="430" r="11"/>
    </g>
    <g fill="none" stroke-width="4" stroke-dasharray="10 8">
      <ellipse cx="145" cy="112" rx="110" ry="80" stroke="#0284c7"/>
      <ellipse cx="390" cy="280" rx="110" ry="85" stroke="#f59e0b"/>
      <ellipse cx="590" cy="462" rx="100" ry="70" stroke="#10b981"/>
    </g>
  </g>
  <!-- segment cards -->
  <g font-size="24">
    <rect x="1080" y="250" width="360" height="200" rx="26" fill="#fff"/>
    <circle cx="1130" cy="310" r="14" fill="#0284c7"/><text x="1160" y="318" fill="#0f172a" font-weight="600">Champions</text>
    <text x="1110" y="370" fill="#64748b" font-size="20">18% of customers</text><text x="1110" y="404" fill="#64748b" font-size="20">52% of revenue</text>
    <rect x="1080" y="490" width="360" height="200" rx="26" fill="#fff"/>
    <circle cx="1130" cy="550" r="14" fill="#f59e0b"/><text x="1160" y="558" fill="#0f172a" font-weight="600">Regulars</text>
    <text x="1110" y="610" fill="#64748b" font-size="20">47% of customers</text><text x="1110" y="644" fill="#64748b" font-size="20">39% of revenue</text>
    <rect x="1080" y="730" width="360" height="200" rx="26" fill="#fff"/>
    <circle cx="1130" cy="790" r="14" fill="#10b981"/><text x="1160" y="798" fill="#0f172a" font-weight="600">At risk</text>
    <text x="1110" y="850" fill="#64748b" font-size="20">35% of customers</text><text x="1110" y="884" fill="#64748b" font-size="20">9% of revenue</text>
  </g>
