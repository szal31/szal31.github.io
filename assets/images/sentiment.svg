<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#134e4a"/></linearGradient>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <circle cx="1480" cy="160" r="260" fill="#fff" opacity=".06"/>
  <!-- review cards -->
  <g font-size="24">
    <rect x="170" y="210" width="700" height="190" rx="26" fill="#fff"/>
    <text x="210" y="268" fill="#f59e0b" font-size="34">★★★★★</text>
    <text x="210" y="322" fill="#0f172a">"Battery lasts all day, love the screen."</text>
    <rect x="210" y="344" width="150" height="40" rx="20" fill="#dcfce7"/><text x="285" y="372" fill="#15803d" text-anchor="middle" font-size="20" font-weight="600">Positive</text>

    <rect x="230" y="430" width="700" height="190" rx="26" fill="#fff"/>
    <text x="270" y="488" fill="#f59e0b" font-size="34">★★<tspan fill="#e2e8f0">★★★</tspan></text>
    <text x="270" y="542" fill="#0f172a">"Support took weeks to reply."</text>
    <rect x="270" y="564" width="150" height="40" rx="20" fill="#fee2e2"/><text x="345" y="592" fill="#b91c1c" text-anchor="middle" font-size="20" font-weight="600">Negative</text>

    <rect x="170" y="650" width="700" height="190" rx="26" fill="#fff"/>
    <text x="210" y="708" fill="#f59e0b" font-size="34">★★★★<tspan fill="#e2e8f0">★</tspan></text>
    <text x="210" y="762" fill="#0f172a">"Smooth setup, works with everything."</text>
    <rect x="210" y="784" width="150" height="40" rx="20" fill="#dcfce7"/><text x="285" y="812" fill="#15803d" text-anchor="middle" font-size="20" font-weight="600">Positive</text>
  </g>
  <!-- result card -->
  <rect x="1000" y="260" width="430" height="620" rx="32" fill="#fff"/>
  <text x="1215" y="340" fill="#0f172a" font-size="28" font-weight="600" text-anchor="middle">Best model</text>
  <g transform="translate(1215 540)" fill="none" stroke-width="40">
    <circle r="120" stroke="#ccfbf1"/>
    <circle r="120" stroke="#0f766e" stroke-dasharray="560 754" stroke-linecap="round" transform="rotate(-90)"/>
  </g>
  <text x="1215" y="556" fill="#0f172a" font-size="54" font-weight="700" text-anchor="middle">74.3%</text>
  <text x="1215" y="730" fill="#0f766e" font-size="28" font-weight="600" text-anchor="middle">Random Tree</text>
  <text x="1215" y="770" fill="#64748b" font-size="22" text-anchor="middle">10-fold cross-validation</text>
  <text x="1215" y="830" fill="#64748b" font-size="22" text-anchor="middle">1,000 Trustpilot reviews</text>
</svg>
