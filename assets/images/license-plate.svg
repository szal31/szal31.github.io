<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="7"/></filter>
    <pattern id="noise" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="none"/><circle cx="4" cy="6" r="2.5" fill="#fff" opacity=".7"/><circle cx="16" cy="18" r="2" fill="#000" opacity=".6"/><circle cx="19" cy="4" r="1.6" fill="#fff" opacity=".5"/>
    </pattern>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <!-- normal plate -->
  <text x="180" y="270" fill="#c7d2fe" font-size="24" letter-spacing="3">NORMAL</text>
  <rect x="180" y="300" width="560" height="170" rx="18" fill="#111827" stroke="#e5e7eb" stroke-width="6"/>
  <text x="460" y="418" fill="#f9fafb" font-size="96" font-weight="700" text-anchor="middle" font-family="Consolas, monospace">BKR 4821</text>
  <!-- damaged plate -->
  <text x="180" y="640" fill="#c7d2fe" font-size="24" letter-spacing="3">DAMAGED</text>
  <g>
    <rect x="180" y="670" width="560" height="170" rx="18" fill="#111827" stroke="#e5e7eb" stroke-width="6"/>
    <text x="460" y="788" fill="#f9fafb" font-size="96" font-weight="700" text-anchor="middle" font-family="Consolas, monospace" filter="url(#blur)">WTA 7350</text>
    <rect x="180" y="670" width="560" height="170" rx="18" fill="url(#noise)"/>
    <rect x="520" y="690" width="150" height="90" fill="#374151"/>
  </g>
  <!-- pipeline -->
  <g font-size="26" font-weight="600" text-anchor="middle">
    <path d="M770 570 H860" stroke="#c7d2fe" stroke-width="5"/>
    <rect x="870" y="480" width="240" height="180" rx="22" fill="#fff"/>
    <text x="990" y="560" fill="#312e81">HOG + LBP</text>
    <text x="990" y="600" fill="#6b7280" font-size="20" font-weight="400">features</text>
    <path d="M1120 570 H1180" stroke="#c7d2fe" stroke-width="5"/>
    <rect x="1190" y="380" width="230" height="380" rx="22" fill="#fff"/>
    <text x="1305" y="450" fill="#312e81">Classifiers</text>
    <g font-size="24" font-weight="500">
      <rect x="1225" y="490" width="160" height="56" rx="28" fill="#e0e7ff"/><text x="1305" y="527" fill="#3730a3">SVM</text>
      <rect x="1225" y="565" width="160" height="56" rx="28" fill="#e0e7ff"/><text x="1305" y="602" fill="#3730a3">Random Forest</text>
      <rect x="1225" y="640" width="160" height="56" rx="28" fill="#e0e7ff"/><text x="1305" y="677" fill="#3730a3">KNN</text>
    </g>
  </g>
  <g font-size="24" font-weight="600">
    <rect x="1190" y="800" width="230" height="64" rx="32" fill="#22c55e"/><text x="1305" y="842" fill="#fff" text-anchor="middle">Normal / Damaged</text>
  </g>
  <text x="180" y="950" fill="#e0e7ff" font-size="26">1,000 images · 500 normal · 500 degraded (blur, blockage, noise)</text>
</svg>
